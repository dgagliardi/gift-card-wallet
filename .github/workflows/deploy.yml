name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Enable only after the separately approved migration has been accepted.
    if: contains(github.event.head_commit.message, '[deploy]') && vars.GIFTCARD_NODE24_MIGRATION_ACCEPTED == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -e
            # App/build runtime is independent of the existing PM2 daemon.
            APP_NODE=/home/brenni6/.local/node-v24/bin/node
            export PATH="$(dirname "$APP_NODE"):$PATH"
            test "$("$APP_NODE" --version)" = v24.20.0
            test "$(node --version)" = v24.20.0
            test "$(pnpm --version)" = 9.15.0
            cd ${{ secrets.DEPLOY_PATH }}

            # The known dirty production checkout requires operator reconciliation.
            # Do not stash, reset, clean, or print operational file contents here.
            CHECKOUT_STATE=$(git status --porcelain) || {
              echo "Deployment blocked: checkout state could not be established."
              exit 1
            }
            if test -n "$CHECKOUT_STATE"; then
              echo "Deployment blocked: checkout needs an approved reconciliation."
              exit 1
            fi

            echo "==> Pulling latest code..."
            git pull

            echo "==> Installing dependencies..."
            CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++ \
            CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc \
            npm_config_python=/usr/bin/python3.11 \
            pnpm install --frozen-lockfile

            echo "==> Cleaning previous Next build artifacts..."
            rm -rf apps/web/.next

            echo "==> Building..."
            # Build imports lib/db.ts; never let it open the live wallet.
            BUILD_DATA=$(mktemp -d "${TMPDIR:-/tmp}/giftcard-build.XXXXXX")
            cleanup_build_data() {
              case "${BUILD_DATA:-}" in
                "${TMPDIR:-/tmp}"/giftcard-build.*) rm -rf -- "$BUILD_DATA" ;;
                "") ;;
                *) echo "Refusing unsafe build-data cleanup target." >&2; return 1 ;;
              esac
            }
            trap cleanup_build_data EXIT
            mkdir -p "$BUILD_DATA/uploads"
            DATABASE_PATH="$BUILD_DATA/wallet.db" \
            UPLOADS_PATH="$BUILD_DATA/uploads" \
            pnpm build

            echo "==> Copying static assets..."
            cp -r apps/web/public apps/web/.next/standalone/apps/web/public
            cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static

            echo "==> Restarting app..."
            pm2 restart giftcard --interpreter "$APP_NODE" --update-env

            echo "==> Done."
